name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --python 3.11

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t ai-support-agent .

      - name: Run container and check /health
        run: |
          docker run -d --name app -p 7860:7860 ai-support-agent
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1

      # Render'ın ücretsiz sunucusu gibi 0.1 CPU ile MCP sunucusuna bağlanabiliyor muyuz?
      # (Model çağrılmaz; sadece alt süreç başlatılıp araç listesi alınır.)
      - name: MCP tool server starts on 0.1 CPU
        run: |
          docker run --rm --cpus=0.1 ai-support-agent python -c "
          import asyncio, time
          from ai_support_agent.agents.operations_agent.agent import operasyon_araclari
          async def main():
              baslangic = time.monotonic()
              araclar = await operasyon_araclari.get_tools()
              print(f'{len(araclar)} araç, {time.monotonic() - baslangic:.1f} sn:', [a.name for a in araclar])
              assert 'kargo_ucreti_hesapla' in [a.name for a in araclar]
              await operasyon_araclari.close()
          asyncio.run(main())
          "
